services:
  ledgoryx:
    build:
      context: .
      dockerfile: Dockerfile

    image: ledgoryx:local

    container_name: ledgoryx

    restart: unless-stopped

    init: true

    ports:
      - "127.0.0.1:3187:3000"

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 128

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
